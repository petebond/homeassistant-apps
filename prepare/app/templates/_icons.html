{# Line icons for the checklist sections. Drawn for Prepare; generic shapes. #}

{%- elif k == 'light_warmth' %}<path d="M9 3h6l-1 6h-4z"/><rect x="10" y="9" width="4" height="12" rx="1"/><path d="M5 5l2 1M19 5l-2 1M4 10h2M18 10h2"/>

{%- elif k == 'money_docs' %}<rect x="4" y="6" width="16" height="13" rx="2"/><path d="M4 10h16"/><path d="M8 15h4"/>

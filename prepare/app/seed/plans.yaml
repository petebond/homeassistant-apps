# Starting-point family plans. Edit them for your household in the app.
# Steps are drawn from UK Government "Be ready for emergencies" and the hazards pages:
#   https://beready.campaign.gov.uk/be-ready-for-emergencies/
#   https://beready.campaign.gov.uk/be-informed-about-hazards/

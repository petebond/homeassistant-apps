<label for="m-name">Medicine</label><input id="m-name" name="name" required class="wide" value="{{ med.name if med else '' }}" placeholder="e.g. Paracetamol">
<div class="row2">
<div><label for="m-str">Strength</label><input id="m-str" name="strength" class="wide" value="{{ med.strength if med else '' }}" placeholder="500mg"></div>
<div><label for="m-qty">Quantity held</label><input id="m-qty" name="quantity" class="wide" value="{{ med.quantity if med else '' }}" placeholder="32 tablets"></div>
</div>
<label for="m-dose">Dose <span class="hint">how to take it</span></label><input id="m-dose" name="dose" class="wide" value="{{ med.dose if med else '' }}" placeholder="2 tablets up to 4 times a day">
<label for="m-owner">For</label>
<select id="m-owner" name="owner_id">
<option value="">Household (shared)</option>
{% for p in people %}<option value="{{ p.id }}"{% if med and med.owner_id == p.id %} selected{% endif %}>{{ p.name }} ({{ p.type }})</option>{% endfor %}
</select>
<div class="row2">
<div><label for="m-exp">Expiry</label><input id="m-exp" name="expiry" type="date" class="wide" value="{{ med.expiry or '' if med else '' }}"></div>
<div><label for="m-rep">Next repeat due <span class="hint">request up to 5 working days before</span></label><input id="m-rep" name="repeat_due" type="date" class="wide" value="{{ med.repeat_due or '' if med else '' }}"></div>
</div>
<label for="m-notes">Notes</label><input id="m-notes" name="notes" class="wide" value="{{ med.notes if med else '' }}">

add_item:
  fields:
    name:
      required: true
      selector:
        text:
    category:
      default: other
      selector:
        select:
          options: [water, food, torch, batteries, warmth, radio, powerbank, cash, documents, firstaid, sanitiser, wipes, bathroom, baby, pet, car, other]
    quantity:
      default: 1
      selector:
        number:
          min: 0
          max: 10000
          step: any
          mode: box
    unit:
      selector:
        text:
    best_before:
      selector:
        date:
    location:
      selector:
        text:
consume_item:
  fields:
    item_id:
      required: true
      selector:
        number:
          min: 1
          max: 1000000
          mode: box
    quantity:
      selector:
        number:
          min: 0
          max: 10000
          step: any
          mode: box
    discard:
      default: false
      selector:
        boolean:
mark_printed:

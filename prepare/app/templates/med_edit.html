{% extends "base.html" %}
{% block title %}Edit medication{% endblock %}
{% block content %}
<p><a href="{{ b }}/meds">‹ Medication</a></p>
<h1>Edit: {{ med.name }}</h1>
<form method="post" action="{{ b }}/meds/{{ med.id }}" class="formbox">
{% include "_med_form.html" %}
<div class="acts"><button class="primary">Save</button> <a class="button ghost" href="{{ b }}/meds">Cancel</a></div>
</form>
<form method="post" action="{{ b }}/meds/{{ med.id }}/delete" onsubmit="return confirm('Delete this medication?')"><button class="ghost danger small">Delete</button></form>
{% endblock %}

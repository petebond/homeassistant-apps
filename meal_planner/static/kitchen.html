<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meals</title>
<script>
/* Sets the theme before first paint, so a cast display never flashes the
   wrong one.

   The real setting now comes from the server, with everything else the display
   is told about how it should look, and is applied by kitchen.js the moment the
   first poll lands. This runs before that: it uses the last one seen on this
   device, so a Hub that has been showing the light theme for a month doesn't
   blink through dark on every reload. ?theme= still wins, and is still
   remembered, because it is the one way to change this from the casting end. */
(function () {
  var t = null;
  try {
    var m = /[?&]theme=(light|dark)/.exec(location.search);
    if (m) { t = m[1]; localStorage.setItem("mp-kitchen-theme", t); }
    else { t = localStorage.getItem("mp-kitchen-theme"); }
    var a = localStorage.getItem("mp-kitchen-accent");
    if (a) { document.documentElement.setAttribute("data-accent", a); }
    var z = localStorage.getItem("mp-kitchen-zoom");
    if (z && z !== "1") {
      document.documentElement.style.setProperty("--k-zoom", z);
      document.documentElement.setAttribute("data-zoomed", "");
    }
  } catch (e) { /* storage disabled - fall through to the defaults */ }
  document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
})();
</script>
<link rel="stylesheet" href="/kitchen.css">
</head>
<body>

<div id="screen" class="screen">

  <!-- The "not updating" warning used to share a header row with the cook.
       With the cook moved down into the panel there was nothing left up there
       worth a row of its own, so the warning floats in the corner instead and
       the whole of that height goes to the meals. -->
  <span id="stale" class="stale" hidden>not updating</span>

  <main class="strip">
    <div id="today" class="meals"></div>
    <aside class="info">
      <span id="clock" class="clock">&nbsp;</span>
      <span id="showing" class="info-showing" hidden>Currently showing</span>
      <h1 id="day-name" class="info-day">&nbsp;</h1>
      <p id="day-date" class="info-date">&nbsp;</p>
      <!-- The cook, and how many they are cooking for. The count is its own
           line rather than a tail on the name: this panel is a column about
           six inches wide on a Nest Hub, and "Han, for 5 people" on one line
           either wraps in the middle of the name or shrinks it. -->
      <div class="cooking">
        <span class="cooking-label">Cooking</span>
        <span id="cook" class="cook-name">&nbsp;</span>
        <span id="cook-for" class="cook-for" hidden>&nbsp;</span>
      </div>

      <!-- The dinner bell. Hidden unless it is switched on, has speakers and
           the display's own switch is on - see /api/kitchen's `bell`. Bottom
           of the panel because it is the one thing on this screen anybody
           reaches out and touches, and the bottom is the reachable end of a
           Hub. -->
      <button id="bell-btn" class="bell-btn" type="button" hidden>Dinner time!</button>
    </aside>
  </main>

  <!-- The bottom row: the week, and the way into the shopping list at the end
       of it as one more column.

       The button is a sibling of the strip rather than a cell inside it
       because renderWeek() empties #week and rebuilds it from the feed every
       minute - anything parked in there would be thrown away on the first
       poll. This wrapper is what owns the rule above the row and the height of
       it, so the two halves can't drift apart. -->
  <div class="weekbar">
    <footer id="week" class="week"></footer>
    <button id="shop-btn" class="shop-btn" type="button" hidden>
      <span class="shop-btn-label">Shopping</span>
      <span id="shop-count" class="shop-count" hidden>0</span>
    </button>
  </div>

</div>

<!-- The shopping list, over the whole screen rather than in the panel. A list
     of things to buy is not a glance, it is a thing somebody has walked over to
     read, and squeezing it into a third of the width would make it neither.

     Two faces, one at a time: the list itself, and the grid of names to add
     from. The grid is a separate face rather than a strip along the bottom of
     the list because the tiles have to be big enough to hit with a wet hand,
     and there is no room for both. -->
<div id="shop" class="shop" hidden>

  <div id="shop-list" class="shop-face">
    <header class="shop-head">
      <h2 class="shop-title">Shopping list</h2>
      <span id="shop-page" class="shop-page" hidden></span>
    </header>
    <div id="shop-rows" class="shop-rows"></div>
    <footer class="shop-foot">
      <button id="shop-add" class="shop-act shop-act-go" type="button">Add something</button>
      <button id="shop-more" class="shop-act" type="button" hidden>More ↓</button>
      <button id="shop-close" class="shop-act" type="button">Done</button>
    </footer>
  </div>

  <div id="shop-pick" class="shop-face" hidden>
    <header class="shop-head">
      <h2 class="shop-title">What do you need?</h2>
      <span id="pick-page" class="shop-page" hidden></span>
    </header>
    <div id="pick-grid" class="pick-grid"></div>
    <footer class="shop-foot">
      <button id="pick-more" class="shop-act" type="button" hidden>More ↓</button>
      <button id="pick-back" class="shop-act" type="button">Back</button>
    </footer>
  </div>

</div>

<!-- Night dimming, drawn over everything and never in the way of anything.
     kitchen.js fades it in and out; see applyDisplay(). -->
<div id="nightfall" class="nightfall"></div>

<script src="/kitchen.js"></script>
</body>
</html>
